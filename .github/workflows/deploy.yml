name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: Show OIDC subject
        uses: actions/github-script@v7
        with:
          script: |
            const t = await core.getIDToken('sts.amazonaws.com');
            const c = JSON.parse(Buffer.from(t.split('.')[1], 'base64url').toString());
            console.log('sub:', c.sub);
      - name: AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Login to AWS
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        run: |
          docker build -f apps/api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
      # The SSM document from infra/app/deploy.tf: writes the container's env file (DATABASE_URL,
      # BETTER_AUTH_*), runs migrations in a one-off container, then swaps the app container.
      - name: Deploy to EC2
        env:
          DOCUMENT: ${{ vars.DEPLOY_DOCUMENT_NAME }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          if [ -z "$DOCUMENT" ]; then
            echo "::error::Set the DEPLOY_DOCUMENT_NAME repository variable (terraform output deploy_document_name)"
            exit 1
          fi
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "$DOCUMENT" \
            --parameters '{"ImageTag":["${{ github.sha }}"],"MigrateCommand":["pnpm db:deploy"]}' \
            --query Command.CommandId --output text)
          # The waiter gives up after ~100 s, which a deploy with migrations can exceed; keep waiting
          until aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"; do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text)
            case "$STATUS" in
              Pending|InProgress|Delayed) echo "Deploy still $STATUS..." ;;
              *) break ;;
            esac
          done
          # Show the deploy script's output in the job log, and fail the job if the deploy failed
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '[Status, StandardOutputContent, StandardErrorContent]' --output text
          test "$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query Status --output text)" = Success

  # Runs in parallel with deploy-api: the React build goes to S3, CloudFront serves it
  deploy-web:
    runs-on: ubuntu-latest
    env:
      BUCKET: ${{ vars.FRONTEND_BUCKET }}
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: Install Node and dependencies
        uses: ./.github/actions/setup
      - name: Build frontend
        run: pnpm --filter @guacamole/web build
      - name: AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Upload to S3
        run: |
          # Hashed file names (index-3f9a1c.js) never change content: cache for a year.
          # No --delete here, so a browser still holding the previous index.html can load its files.
          aws s3 sync apps/web/dist/assets "s3://$BUCKET/assets" \
            --cache-control "public, max-age=31536000, immutable"
          # index.html and other unhashed files: browsers must re-check them on every visit
          aws s3 sync apps/web/dist "s3://$BUCKET" \
            --exclude "assets/*" \
            --cache-control "no-cache" \
            --delete
      - name: Refresh CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" \
            --query Invalidation.Id --output text
