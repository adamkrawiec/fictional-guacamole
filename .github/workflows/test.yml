name: Test

on:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm exec biome ci .

  # Decides which test jobs below need to run
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # YAML anchor: files both apps depend on, so a change there tests both
          filters: |
            shared: &shared
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "tsconfig.base.json"
              - "packages/**"
              - ".github/workflows/test.yml"
              - ".github/actions/setup/**"
            api:
              - *shared
              - "apps/api/**"
            web:
              - *shared
              - "apps/web/**"

  test-api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      # A fresh Postgres for every run, thrown away afterwards
      postgres:
        image: postgres:18-alpine # same major version as docker-compose.yml
        env:
          POSTGRES_USER: guac
          POSTGRES_PASSWORD: guac
          POSTGRES_DB: guacamole_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guac -d guacamole_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Throwaway CI-only credentials for the service above; not a secret
      DATABASE_URL: postgresql://guac:guac@localhost:5432/guacamole_test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Generate Prisma client (git-ignored, needed by typecheck)
        run: pnpm --filter @guacamole/api db:generate
      - run: pnpm --filter @guacamole/api typecheck
      - name: Apply migrations to the test database
        run: pnpm --filter @guacamole/api db:deploy
      - run: pnpm --filter @guacamole/api test

  test-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @guacamole/web test
      - run: pnpm --filter @guacamole/web build # type-checks src (tests included), then bundles
